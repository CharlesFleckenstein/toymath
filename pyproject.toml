[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "toymath"
version = "0.1.0"
description = "A toy math package"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx"]

[tool.setuptools]
packages = ["toymath"]
script-files = ["bin/toymath_calculator"]
