name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v7

      - name: set up python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: install code
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: run tests
        run: pytest

